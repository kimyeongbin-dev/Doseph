[project]
name = "ai-health-example"
version = "0.1.0"
description = "AI 헬스케어 파이널 프로젝트 예시용"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "rq>=2.7.0",           # AI Worker와 Backend 공통 핵심 의존성으로 승격
    "redis>=7.1.0",        # RQ의 브로커 역할을 위해 필수
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "openai>=1.0.0",
    "httpx>=0.28.1",
    "requests>=2.33.1",
    "bleach>=6.3.0",
    "cryptography>=46.0.3",
    "python-dateutil>=2.9.0.post0",
    "tomlkit>=0.14.0",
    "tzdata>=2024.1",
    "defusedxml>=0.7.1",
]

[dependency-groups]
ai = [
    "scikit-learn>=1.8.0",
    "numpy>=2.0.0",
    "psycopg2-binary>=2.9.0",  # pgvector support
    "tqdm>=4.67.0",            # batch seeding progress display
]
app = [
    "aerich>=0.9.2",
    "apscheduler>=3.10.0",
    "asyncpg>=0.30.0",
    "bcrypt<=4.0.1",
    "fastapi[standard]>=0.128.0",
    "numpy>=2.0.0",
    "orjson>=3.11.5",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.10.1",
    "tortoise-orm>=0.25.3",
    "uvicorn>=0.40.0",
]
dev = [
    "bandit>=1.7.0",
    "coverage>=7.13.2",
    "freezegun>=1.5.5",
    "import-linter>=2.3",
    "mypy>=1.19.1",
    "mypy-baseline>=0.7.4",
    "pre-commit>=4.5.1",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
    "ruff>=0.14.14",
    "types-defusedxml>=0.7.0.20260504",
    "types-passlib>=1.7.7.20250602",
    "types-python-dateutil>=2.9.0.20260124",
]

[tool.aerich]
tortoise_orm = "app.db.databases.TORTOISE_ORM"
location = "app/db/migrations"
src_folder = "./."

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["."]
# `db` = 진짜 PostgreSQL 이 필요한 테스트(app/tests/db/). DB 가 없으면 skip 이 아니라
# **실패**한다 — skip 은 "검증하지 않았다"를 초록으로 보이게 만들기 때문이다.
# 빠른 스위트만 돌리려면 `pytest app -m "not db"`.
markers = [
    "db: requires a real PostgreSQL server (see app/tests/db/conftest.py)",
]

[tool.ruff]
line-length = 120
target-version = "py313"
# Exclude auto-generated and migration files
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "app/db/migrations",
]

[tool.ruff.lint]
# Enable comprehensive rule sets for 2025-2026 standards
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "D",      # pydocstyle
    "UP",     # pyupgrade
    "YTT",    # flake8-2020
    "ANN",    # flake8-annotations
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit
    "BLE",    # flake8-blind-except
    "FBT",    # flake8-boolean-trap
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "EXE",    # flake8-executable
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "G",      # flake8-logging-format
    "INP",    # flake8-no-pep420
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "PYI",    # flake8-pyi
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SLOT",   # flake8-slots
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "TC",     # flake8-type-checking (renamed from TCH in ruff 0.6.0+)
    "INT",    # flake8-gettext
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "TD",     # flake8-todos
    "FIX",    # flake8-fixme
    "ERA",    # eradicate
    "PGH",    # pygrep-hooks
    "PL",     # Pylint
    "TRY",    # tryceratops
    "FLY",    # flynt
    "PERF",   # Perflint
    "FURB",   # refurb
    "LOG",    # flake8-logging
    "RUF",    # Ruff-specific rules
]

# Ignore specific rules that conflict with project needs
ignore = [
    # Documentation
    "D100",    # Missing docstring in public module
    "D101",    # Missing docstring in public class
    "D102",    # Missing docstring in public method
    "D103",    # Missing docstring in public function
    "D104",    # Missing docstring in public package
    "D105",    # Missing docstring in magic method
    "D106",    # Missing docstring in public nested class (Tortoise Meta)
    "D107",    # Missing docstring in __init__
    "D203",    # 1 blank line before class docstring (conflicts with D211)
    "D205",    # 1 blank line between summary and description (한국어 docstring 호환)
    "D213",    # Multi-line summary at second line (conflicts with D212)
    "D415",    # First line should end with punctuation (한국어 docstring 호환)

    # Annotations
    "ANN003",  # Missing type annotation for **kwargs
    "ANN204",  # Missing return type for special method (__init__)
    "ANN401",  # Dynamically typed expressions (Any) are disallowed

    # Security (false positives, handled by bandit separately)
    "S101",    # Use of assert detected
    "S105",    # Possible hardcoded password (false positive on config defaults)
    "S108",    # Probable insecure temp file usage (false positive)
    "S311",    # Standard pseudo-random generators

    # Style preferences
    "COM812",  # Trailing comma missing (handled by formatter)
    "ISC001",  # Implicit string concat on one line (handled by formatter)

    # Boolean trap (FastAPI Query/Form params require bool args)
    "FBT001",  # Boolean positional arg in function definition
    "FBT002",  # Boolean default positional arg
    "FBT003",  # Boolean positional value in function call

    # FastAPI / framework specific
    "B008",    # Function calls in argument defaults (FastAPI Depends)
    "BLE001",  # Blind exception catch (needed for top-level handlers)
    "PLC0415", # Import not at top-level (circular import prevention)

    # Exception messages (overly strict for application code)
    "EM101",   # Exception must not use string literal
    "EM102",   # Exception must not use f-string literal
    "TRY003",  # Long messages outside exception class
    "TRY300",  # Consider moving return to else block
    "TRY400",  # Use logging.exception instead of logging.error

    # Logging
    "G004",    # Logging uses f-string (f-string is more readable)

    # Return style
    "RET504",  # Unnecessary assignment before return (useful for debugging)

    # Pylint specific (too strict)
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value in comparison
    "PLW0602", # Global without assignment
    "PLW0603", # Using global statement (needed for signal handlers)
    "PLW2901", # Loop variable overwritten

    # Performance (false positives)
    "PERF203", # try-except in loop

    # Project structure
    "INP001",  # Implicit namespace package (intentionally no __init__.py)
    "TD002",   # Missing author in TODO
    "TD003",   # Missing issue link for TODO
    "FIX002",  # Line contains TODO

    # Windows + Docker volume mount false positive: every file appears executable
    # because the host (NTFS) does not carry POSIX executable bits, so the
    # bind-mounted file inherits 0755 inside the Linux container. chmod is denied
    # on the mount, so this rule cannot be cleanly satisfied — ignore globally.
    "EXE002",

    # Eradicate (too many false positives on comments)
    "ERA001",  # Found commented-out code

    # Tortoise ORM / Pydantic class patterns
    "RUF012",  # Mutable class attribute default (Tortoise Meta.indexes)

    # Type checking
    "TC001",   # Move app import into TYPE_CHECKING block
    "TC002",   # Move third-party import into TYPE_CHECKING block
    "TC003",   # Move stdlib import into TYPE_CHECKING block
]

# Specific ignores per file type
[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",    # Imported but unused
    "F403",    # Star imports
    "D104",    # Missing docstring in public package
]
"app/db/migrations/*" = ["ALL"]  # Ignore all rules in migrations
"tests/*" = [
    "S101",    # Use of assert detected (normal in tests)
    "D",       # Missing docstrings (not required in tests)
    "ANN",     # Missing annotations (not required in tests)
    "PLR2004", # Magic value used in comparison (normal in tests)
    "SLF001",  # Private member accessed (normal in tests)
]
"app/tests/*" = [
    "S101",    # Use of assert detected (normal in tests)
    "D",       # Missing docstrings (not required in tests)
    "ANN",     # Missing annotations (not required in tests)
    "PLR2004", # Magic value used in comparison (normal in tests)
    "SLF001",  # Private member accessed (Tortoise _meta introspection)
    "ARG",     # Unused args (test doubles mirror real signatures; side-effect fixtures)
]
"app/tests/mock_data/*" = [
    "E501",    # Line too long (seed dicts intentionally one-line per row)
    "S101",
    "D",
    "ANN",
    "PLR2004",
    "SLF001",
    "RUF001",  # Ambiguous Korean punctuation (real source data)
]
"scripts/*" = [
    "T201",    # print found (normal in scripts)
    "S602",    # subprocess call with shell=True
    "S603",    # subprocess call without shell=True
    "BLE001",  # Blind exception catch
]
"app/repositories/medication_repository.py" = [
    "DTZ011",  # date.today() usage (existing code, refactor separately)
]
"app/workers/intake_log_worker.py" = [
    "DTZ011",  # date.today() usage (existing code, refactor separately)
]
"app/services/ocr_service.py" = [
    "F811",    # redefined import (existing code, refactor separately)
    "ASYNC230", # blocking open in async (existing code)
    "PTH123",  # open() vs Path.open() (existing code)
    "E501",    # line too long in prompt strings (existing code)
]
"app/tests/test_oauth.py" = [
    "ANN201",  # Missing return type in test functions (existing code)
]
"ai_worker/utils/rag.py" = [
    "T201",    # print for error logging (TODO: replace with proper logging)
]
"ai_worker/*" = [
    "T201",    # print statements allowed in AI worker modules
]
"app/main.py" = [
    "T201",    # print in global exception handler (before logger is available)
]
"app/apis/v1/ocr_routers.py" = [
    "T201",    # print for debug error logging
]
"app/apis/v1/mock_oauth_routers.py" = [
    "ARG001",  # Unused args required by OAuth protocol signature
]
"app/apis/v1/oauth_routers.py" = [
    "ARG001",  # Unused request arg required by FastAPI exception handler signature
]
"app/core/config.py" = [
    "UP007",   # Use X | Y for type annotations (pydantic-settings compatibility)
]

# Import sorting configuration
[tool.ruff.lint.isort]
known-first-party = ["app", "ai_worker"]
known-third-party = ["fastapi", "pydantic", "tortoise", "redis", "openai"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
split-on-trailing-comma = true
force-single-line = false
force-sort-within-sections = true

# Docstring configuration
[tool.ruff.lint.pydocstyle]
convention = "google"

# Pylint configuration
[tool.ruff.lint.pylint]
max-args = 8
max-branches = 15
max-returns = 8
max-statements = 60

# McCabe complexity
[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.format]
# Modern Python formatting standards (2025-2026)
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
# Preview features for cutting-edge formatting
preview = true

[tool.bandit]
exclude_dirs = ["tests", "app/db/migrations"]
skips = ["B101", "B311"]

[tool.mypy]
# Modern Python type checking (2025-2026)
python_version = "3.13"
pretty = true
show_error_codes = true
show_error_context = true
color_output = true
error_summary = true

# Strict type checking
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
warn_return_any = true
warn_unused_configs = true

# Import discovery
namespace_packages = true
explicit_package_bases = true

# Platform configuration
# python_executable 미지정: mypy 가 실행 런타임(uv venv)의 python 을 사용 -> 로컬/CI 에서
# 설치된 패키지(pydantic·fastapi 등) 타입을 정상 해석. bare "python" 은 Windows 에서 venv 가
# 아닌 다른 python 을 가리켜 import-not-found 를 유발(baseline 이 CI 와 불일치)했음.

# Cache configuration
cache_dir = ".mypy_cache"
sqlite_cache = true

# Error reporting
show_absolute_path = false
show_column_numbers = true
show_traceback = true

# Warnings
warn_no_return = true
warn_incomplete_stub = true

# Strict optional
strict_optional = true

plugins = [
  "pydantic.mypy"
]

# Per-module overrides
[[tool.mypy.overrides]]
module = [
    "app.models.*",
    "app.db.migrations.*",
    "tests.*"
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "tortoise.*",
    "aerich.*",
    "redis.*",
    "rq.*",
    "passlib.*",
    "bleach.*",
    "requests.*"
]
ignore_missing_imports = true

# Specific module configurations
[[tool.mypy.overrides]]
# 선언된 의존성이 아닌 선택적 ML 라이브러리(scripts/crawling/fetch_sample.py 의 지연 임포트).
# 타입체크 환경에 설치되지 않아 stub 을 찾을 수 없으므로 누락 임포트만 무시한다.
# (mypy 공식 권장 처리 — 이 오버라이드가 없으면 import-not-found + 안내 note 가 baseline 을 오염시킨다)
module = ["sentence_transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# apscheduler 는 설치돼 있으나 공식 stub·py.typed 마커를 제공하지 않는다(배포처에 stub 없음).
# defusedxml 처럼 types-* 스텁 패키지가 없으므로 누락 임포트만 무시한다.
module = ["apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# asyncpg 도 py.typed 마커를 제공하지 않는다(types-asyncpg 도 없음).
# DB 테스트 층(app/tests/db/)이 Tortoise 를 우회해 직접 붙을 때 쓴다 —
# 비교용 임시 DB 처럼 Tortoise 가 붙어 있지 않은 DB 를 들여다봐야 하기 때문.
module = ["asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.core.config"
# Allow dynamic configuration loading
allow_any_generics = true
allow_subclassing_any = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ── coverage: 줄 ↔ 그 줄을 실행한 테스트 ──────────────────────────────
# 흐름: 테스트 실행 중 각 줄을 기록할 때 **어느 테스트 함수 안이었는지**를 함께 남긴다
#       -> `.coverage` 의 contexts_by_lineno 로 "이 줄을 고치면 뭐가 반응하나" 조회
#
# 왜 필요한가: import 그래프(`scripts/check_layers.py`)는 정적이라 `Depends(...)`·
#   `getattr`·문자열 참조로 이어진 경로를 못 본다. 이쪽은 **실제로 실행된 기록**이라
#   그 구멍을 덮는다 — 정적·동적을 둘 다 쓰는 이유.
#
# ⚠️ 게이트가 아니다. 커버리지는 "실행됐나"지 "틀리면 빨개지나"가 아니다.
#    조회 CLI = `scripts/coverage_contexts.py`.
[tool.coverage.run]
dynamic_context = "test_function"
# 데이터 파일에 상대경로를 저장한다. 수집은 Docker 안(`/app`)에서 하고 조회는
# 호스트(Windows)에서 하므로, 절대경로로 저장되면 같은 파일을 서로 다른 이름으로 본다.
relative_files = true

# ── import-linter 레이어 계약 ────────────────────────────────────────
# 흐름: grimp 가 app·ai_worker 의 import 그래프를 만든다 -> 계약별 위반 탐색
#       -> 위반이 있으면 pre-push / CI 가 빨개진다
#
# 원칙: **지금 통과하는 계약만 넣는다.**
#   지금 위반 중인 경계(서비스->모델 31건, ai_worker->저장소 7건 등)는 고치지 않고
#   `docs/tech-debt/layer-boundary-violations.md` 에 등재만 한다(발견≠처리).
#   예외로 가득한 게이트는 사람이 끄고, 그러면 옆의 정확한 게이트까지 죽는다
#   — S1.5 에서 식별자 검사를 게이트에서 뺀 것과 같은 이유.
[tool.importlinter]
root_packages = ["app", "ai_worker"]
# ignore_imports 항목이 아무것도 매치하지 않으면 **실패**시킨다.
# 예외가 낡아 무의미해진 것을 조용히 통과시키지 않기 위한 장치.
unmatched_ignore_imports_alerting = "error"

# 역방향 금지. 모델이 저장소를, 저장소가 서비스를, 서비스가 라우터를 import 하면 실패.
# exhaustive = true: `app/` 에 새 하위 패키지가 생기면 여기에 분류될 때까지 실패한다
#   — 계약 바깥에서 자라는 층을 막는다.
[[tool.importlinter.contracts]]
name = "계층 방향 — 라우터 > 서비스 > 저장소 > 모델 (역방향 금지)"
type = "layers"
containers = ["app"]
layers = ["apis", "services", "repositories", "models"]
exhaustive = true
exhaustive_ignores = [
    "core",
    "db",
    "dependencies",
    "dtos",
    "main",
    "middlewares",
    "tests",
    "utils",
    "validators",
    "workers",
]

# 라우터가 서비스를 건너뛰고 DB 접근 계층을 직접 부르는 것을 막는다(현재 위반 0건).
[[tool.importlinter.contracts]]
name = "라우터는 저장소 계층을 건너뛰지 않는다"
type = "forbidden"
source_modules = ["app.apis"]
forbidden_modules = ["app.repositories"]
# 라우터 -> 서비스 -> 저장소 의 **간접** 경로는 정상이다. 직접 import 만 본다.
allow_indirect_imports = true

# 라우터의 ORM 모델 직접 접근 제한. 인증 주체(User) 타입은 DI 시그니처에 불가피해 허용,
# 그 밖의 모델이 라우터로 새로 들어오면 실패한다.
[[tool.importlinter.contracts]]
name = "라우터는 인증 주체 외의 모델을 직접 다루지 않는다"
type = "forbidden"
source_modules = ["app.apis"]
forbidden_modules = ["app.models"]
# 서비스·DTO 를 거쳐 모델에 닿는 **간접** 경로는 정상이다. 직접 import 만 본다.
allow_indirect_imports = true
ignore_imports = [
    # 사유: `Annotated[User, Depends(get_current_user)]` — FastAPI DI 시그니처에 필요.
    "app.apis.v1.* -> app.models.accounts",
    # 사유: OCR 저장 시 라우터가 프로필 소유권을 직접 조회한다. 서비스로 옮겨야 할
    #       기존 위반이며 이 구간에서 고치지 않는다 — 등재 = tech-debt 문서.
    "app.apis.v1.ocr_routers -> app.models.profiles",
]

# 설정·순수 유틸은 애플리케이션 계층을 몰라야 한다(현재 위반 0건).
[[tool.importlinter.contracts]]
name = "core·utils 는 상위 계층을 모른다"
type = "forbidden"
source_modules = ["app.core", "app.utils"]
forbidden_modules = [
    "app.apis",
    "app.dependencies",
    "app.dtos",
    "app.middlewares",
    "app.models",
    "app.repositories",
    "app.services",
    "app.workers",
    "ai_worker",
]

# 모델은 그래프의 잎이다. 어떤 상위 계층도 import 하지 않는다(현재 위반 0건).
[[tool.importlinter.contracts]]
name = "모델은 어떤 상위 계층도 모른다"
type = "forbidden"
source_modules = ["app.models"]
forbidden_modules = [
    "app.apis",
    "app.dependencies",
    "app.dtos",
    "app.middlewares",
    "app.repositories",
    "app.services",
    "app.workers",
    "ai_worker",
]

# AI 워커는 별도 프로세스다. 데이터 계층은 공유하지만 HTTP 계층(라우터·미들웨어·
# 요청 스코프 DI)은 공유하지 않는다 — 공유하는 순간 워커가 웹 요청 맥락에 묶인다.
[[tool.importlinter.contracts]]
name = "ai_worker 는 HTTP 계층을 모른다"
type = "forbidden"
source_modules = ["ai_worker"]
forbidden_modules = [
    "app.apis",
    "app.dependencies",
    "app.middlewares",
]
