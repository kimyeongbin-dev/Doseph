name: ci.yml

# 🔴 CI 와 CD 는 같은 액션 메이저를 쓴다. 갈리면 한쪽에서만 깨지고, 그 신호가 늦게 온다
#    (대장 D53 — 로컬과 CI 가 게이트를 다르게 부르던 것과 같은 모양).
#    `scripts/gates/doc/check_rule_layers.py` 가 두 워크플로를 대조해 막는다.
env:
  UV_VERSION: '0.11.2'   # 로컬과 같은 버전. 올릴 때 deploy.yml 과 **함께** 올린다

on:
  push:
    branches:
      - main
      - develop
      - 'release/*'
      - 'hotfix/*'
  pull_request:
    # feature 브랜치는 보통 develop으로 PR을 생성하기 때문에 develop이 target 브랜치에 포함되어 있다면 별도로 적지 않아도 됩니다.
    branches:
      - main
      - develop
      - 'release/*'
      - 'hotfix/*'

jobs:

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # 🔴 버전을 고정한다. 안 고정하면 setup-uv 가 매 실행마다 astral-sh/versions 에서
          #    버전 목록을 받아오는데, 그 fetch 가 실패해 CI 가 통째로 빨개진 적이 있다
          #    (2026-09-20, `##[error]fetch failed`). 우리 코드와 무관한 외부 의존이다.
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Run Bandit Security Check
        run: uv run bandit -c pyproject.toml -r app/ -f json -o bandit-report.json || true

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json

      - name: Run Bandit (fail on high severity)
        run: uv run bandit -c pyproject.toml -r app/ -ll

  # ── BE 린트 게이트 (Ruff) ────────────────────────────────────────────
  # 흐름: uv sync(dev) -> ruff check(정적 규칙) -> ruff format --check(포맷 검증)
  # CLAUDE.md 의무 검사이나 그간 CI 미포함이던 갭을 게이트로 승격. 실패 시 RED.
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # 🔴 버전을 고정한다. 안 고정하면 setup-uv 가 매 실행마다 astral-sh/versions 에서
          #    버전 목록을 받아오는데, 그 fetch 가 실패해 CI 가 통째로 빨개진 적이 있다
          #    (2026-09-20, `##[error]fetch failed`). 우리 코드와 무관한 외부 의존이다.
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # 전체 의존성 설치(app+ai+dev): mypy 가 app/ai 라이브러리 타입을 실제로 해석해야
      # baseline 이 로컬(전체 deps)과 일치(dev 만이면 Any 처리로 오류 집합이 달라짐).
      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Ruff check
        run: uv run ruff check app/ ai_worker/

      - name: Ruff format check
        run: uv run ruff format --check app/ ai_worker/

      # MyPy baseline 게이트: 기존 오류는 .mypy-baseline.txt 로 고정, 신규 타입오류만 차단.
      # 로컬 pre-push 와 동일 스크립트(--platform linux 고정) 호출(DRY) -> baseline 이식.
      - name: MyPy (baseline gate)
        run: uv run python scripts/mypy_gate.py

      # 레이어 계약 게이트: 계약 정본은 pyproject.toml 의 [tool.importlinter].
      # 로컬 pre-push 와 **동일 호출 형태**(`-m scripts.gates.code.check_layers`)를 쓴다(DRY).
      # 지금 통과하는 계약만 들어 있다 — 기존 위반은 docs/tech-debt/ 에 등재만 했다.
      - name: Layer contracts (import-linter)
        # 🔴 반드시 `-m` 으로 부른다. 파일 경로로 부르면 sys.path[0] 이 스크립트 폴더라
        #    게이트가 쓰는 `from scripts.gates._root import …` 가 ModuleNotFoundError 로 죽는다.
        #    pre-commit(.pre-commit-config.yaml)도 `-m` 을 쓴다 — 둘이 갈리면 로컬만 초록이 된다.
        run: uv run python -m scripts.gates.code.check_layers

  # ── FE 게이트 (ESLint · npm audit · 정적 빌드) ───────────────────────
  # 흐름: npm ci -> eslint(보안룰 react/no-danger 포함) -> npm audit(blocking)
  #       -> next build(정적 export, out/ 산출)
  # audit 는 blocking(high 이상 발견 시 RED). 2026-09-13 취약점 0건 정리 완료 후
  # report-only -> blocking 승격(Dependabot next 16.3.4 그룹머지 + npm audit fix).
  frontend:
    name: Frontend (ESLint · audit · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medication-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Node 22: Vitest 5 가 ^22.12 이상을 요구(로컬 개발환경과도 동일). Next 16 지원 범위.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: medication-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      # 컴포넌트/유닛 테스트 (Vitest + RTL) — jsdom 위 격리 렌더, 백엔드 불필요.
      - name: Unit tests (Vitest)
        run: npm run test:unit

      # CSP 해시 주입 스크립트의 단위 테스트 (node --test · 브라우저·백엔드 불필요, 실측 5건).
      # 배선 이유: 이 5건이 CI 밖이라 주입 로직이 깨져도 **프로드에서만** 드러났다(QA-48).
      - name: Header/CSP unit tests (node --test)
        run: npm run test:headers

      - name: npm audit (blocking, high 이상)
        run: npm audit --audit-level=high

      # 🔴 배포와 **같은 사슬**로 굽는다 (QA-49). `next build` 만 하면 CSP 인라인 해시가
      #    주입되지 않아 산출물 _headers 에 `__INLINE_SCRIPT_HASHES__` 토큰이 그대로 남는다.
      #    프로드(CF Pages)는 주입을 돌린다 — 2026-09-22 실측: doseph.com 의 script-src 에 실제 sha256.
      #    `npm run build` 대신 `build:pages` 를 부르는 이유: 전자는 dotenv 로 ../.env 를 읽는데
      #    CI 에는 그 파일이 없다. 값은 아래 env 블록이 준다.
      - name: Build (static export + CSP 해시 주입)
        run: npm run build:pages
        env:
          NEXT_PUBLIC_ENV: prod
          NEXT_PUBLIC_API_BASE_URL: https://api.doseph.com

      # 주입이 **실제로** 일어났는지 산출물로 확인한다 — 스크립트가 조용히 빠져나가도 여기서 빨개진다.
      # *0건은 «위반 없음» 이 아니라 «아무것도 못 봤음»* 이라 해시 수의 바닥값도 함께 본다.
      - name: Verify CSP hashes injected
        run: |
          if grep -q '__INLINE_SCRIPT_HASHES__' out/_headers; then
            echo '::error::out/_headers 에 플레이스홀더가 남아 있다 — CSP 해시 주입이 안 됐다'
            exit 1
          fi
          hashes=$(grep -o "sha256-" out/_headers | wc -l)
          if [ "$hashes" -lt 10 ]; then
            echo "::error::CSP 해시가 ${hashes}개뿐이다 (바닥값 10) — 주입이 반만 됐다"
            exit 1
          fi
          echo "✅ CSP 해시 주입 확인 — ${hashes}개 (플레이스홀더 없음)"

  # ── E2E (Playwright) ─────────────────────────────────────────────
  # 흐름: .env 생성 -> compose 로 백엔드 스택 기동 -> 헬스 확인
  #       -> npm ci -> **local 타깃** 정적 빌드 -> 브라우저 설치 -> E2E 실행
  #       -> 인벤토리 게이트(바닥값) -> 실패 산출물 업로드
  # 왜 있는가: 이 61건이 로컬 전용이라 **남이 깨도 초록으로 머지**됐다(QA-08).
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # 🔴 로컬과 **같은 docker-compose.yml** 을 쓴다. service containers 로 다시 쓰면
      #    같은 스택의 두 번째 정의가 생겨 로컬과 CI 가 갈린다(대장 D53).
      #    그리고 이 compose 는 **E2E 용 레이트리밋 상향**을 이미 담고 있다 —
      #    운영 기본값(GET 200/분)이면 스위트 중반부터 429 가 나고, FE 는 그 실패를
      #    빈 목록으로 렌더해 '데이터가 없다'로 오인된다.
      #    ⚠️ ai-worker 는 띄우지 않는다 — 로컬 실측에서 fastapi·postgres·redis 만으로 61건 전부 통과.
      - name: Create .env (compose 는 env_file 이 필수다)
        run: |
          cat > .env <<'ENVEOF'
          ENV=local
          NEXT_PUBLIC_ENV=local
          DB_HOST=postgres
          DB_PORT=5432
          DB_USER=doseph_admin
          DB_PASSWORD=doseph_admin
          DB_NAME=doseph_db
          REDIS_URL=redis://redis:6379/0
          DOCKER_USER=ci
          DOCKER_REPOSITORY=doseph
          APP_VERSION=ci
          AI_WORKER_VERSION=ci
          ENVEOF

      - name: Start backend stack
        run: docker compose up -d --wait postgres redis fastapi

      # 🔴 CI 의 postgres 는 **빈 DB** 다. 로컬은 볼륨이 스키마를 들고 있어 이 단계가
      #    구조적으로 안 보였고, 첫 CI 실행에서 relation "accounts" does not exist 로 드러났다.
      #    프로드도 같은 일을 한다 — docker-compose.gcp-login.yml 의 migrate 서비스가
      #    aerich upgrade 를 마친 뒤에야 fastapi 가 뜬다(service_completed_successfully).
      #    test 잡의 DB 층도 같다(conftest 가 doseph_db_test 를 만들고 aerich upgrade).
      - name: Apply migrations (aerich upgrade)
        run: docker compose exec -T fastapi sh -c 'cd /app && uv run --no-sync aerich upgrade'

      # 스키마가 **실제로** 생겼는지 센다 — upgrade 가 조용히 아무것도 안 해도 여기서 빨개진다.
      # 바닥값 15 는 «통째로 안 돌았다» 를 잡는 용도다(실측 18). 정확값으로 안 박는 이유는
      # 마이그레이션이 테이블을 합치거나 지울 수도 있어서다 — 여기서 잡을 실패는 0 에 가까운 쪽이다.
      - name: Verify schema
        run: |
          tables=$(docker compose exec -T postgres psql -U doseph_admin -d doseph_db -tAc "select count(*) from information_schema.tables where table_schema='public'" | tr -d '[:space:]')
          echo "public 스키마 테이블 = ${tables}"
          if [ "${tables}" -lt 15 ]; then
            echo "::error::테이블이 ${tables}개뿐이다 (바닥값 15) — 마이그레이션이 안 돌았다"
            exit 1
          fi

      # 기동 실패를 **E2E 실패로 위장시키지 않는다** — 여기서 먼저 빨개진다.
      - name: Backend health
        run: curl -fsS http://localhost:8000/api/v1/health

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: medication-frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: medication-frontend
        run: npm ci

      # 🔴 e2e 는 **local 타깃**으로 따로 굽는다. frontend 잡의 out/ 은 프로드 API 를
      #    가리키므로(NEXT_PUBLIC_API_BASE_URL=https://api.doseph.com) 재사용하면
      #    **테스트가 프로드를 때린다.** 미설정 시 env.js 기본값 = http://localhost:8000.
      - name: Build (local target + CSP 해시 주입)
        working-directory: medication-frontend
        run: npm run build:pages
        env:
          NEXT_PUBLIC_ENV: local

      # 공식 가이드(playwright.dev/docs/ci)대로 --with-deps. **캐시는 만들지 않는다** —
      # 공식적으로 비권장이다(복원 시간이 내려받는 시간과 비슷하다).
      - name: Install Playwright browsers
        working-directory: medication-frontend
        run: npx playwright install --with-deps chromium

      # npm run test:e2e 가 아니라 직접 부른다 — 그 스크립트는 dotenv 로 ../.env 를 읽는데
      # 여기서는 위 env 블록과 compose 가 값을 준다.
      - name: Run E2E
        working-directory: medication-frontend
        run: npx playwright test

      # 🔴 Playwright 는 «0건» 만 막는다(실측: Error: No tests found -> 종료코드 1).
      #    **61건이 21건으로 줄어도 종료코드 0** 이다 — 그 구멍을 이 게이트가 막는다.
      #    실패해도 돌려서 «몇 건이 돌았는지» 를 로그에 남긴다.
      - name: E2E Inventory Gate
        if: ${{ !cancelled() }}
        run: python -m scripts.gates.code.check_e2e_inventory

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            medication-frontend/playwright-report/
            medication-frontend/playwright-report.json
            medication-frontend/test-results/
          retention-days: 7

      - name: Backend logs (실패 시에만)
        if: failure()
        run: docker compose logs --tail=120 fastapi
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # 로컬 docker-compose 와 **같은 이미지·같은 태그**를 쓴다. 전에는 postgres:15-alpine
        # 이라 pgvector 확장이 없어, RAG 벡터 경로(medicine_chunk halfvec)를 CI 에서
        # 구조적으로 검증할 수 없었다(환경 동일성 — 대장 D11 의 DB 축).
        # ⚠️ 태그는 PG 메이저와 pgvector 버전까지 **완전 고정**한다. 기준은 "최신"이 아니라
        #    **prod(Neon)와 같게** — 2026-09-15 실측 prod = PostgreSQL 17.11 · pgvector 0.8.0.
        #    그때까지 로컬/CI 는 PG15 라 메이저가 2단계 어긋나 있었다(T4).
        #    이 값을 바꾸면 app/tests/db/test_db_version_pin.py 가 빨개진다.
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pw1234
          POSTGRES_DB: doseph_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # 🔴 버전을 고정한다. 안 고정하면 setup-uv 가 매 실행마다 astral-sh/versions 에서
          #    버전 목록을 받아오는데, 그 fetch 가 실패해 CI 가 통째로 빨개진 적이 있다
          #    (2026-09-20, `##[error]fetch failed`). 우리 코드와 무관한 외부 의존이다.
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --group app --frozen

      - name: Check if tests exist
        id: check_tests
        # tests 폴더나 test_*.py 파일이 있는지 확인
        run: |
          if [ -d "tests" ] || [ $(find . -name "test_*.py" | wc -l) -gt 0 ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Tests with Coverage
        if: steps.check_tests.outputs.has_tests == 'true'
        env:
          PYTHONPATH: "."
          # ENV 는 필수값(기본값 없음 — fail-closed). CI 에는 .env 가 없으므로 명시 주입.
          ENV: local
          DB_USER: postgres
          DB_PASSWORD: pw1234
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: doseph_db
        # DB 층(-m db)을 **별도 스텝으로 분리**한 이유:
        #   ① 어느 층이 깨졌는지 로그에서 바로 보인다.
        #   ② pytest 는 수집된 테스트가 0건이면 **exit 5** 로 실패한다. 즉 마커나
        #      경로가 어긋나 DB 층이 통째로 안 돌면 이 스텝이 빨개진다. 한 번에
        #      돌리면 "0건 실행"이 조용히 초록으로 지나간다(skip 과 같은 실패 방식).
        #   ③ 루트 `tests/`(180건)도 반드시 함께 돌린다. 2026-09-15 까지 이 경로가
        #      어느 워크플로에도 없어 **23건이 4개월 반 빨간 채 방치**돼 있었다(QA-27).
        #      경로를 빼면 그 상태로 되돌아간다.
        # DB 층은 conftest 가 doseph_db_test 를 새로 만들어 aerich upgrade 로 세운다.
        # CI 의 postgres 는 슈퍼유저라 CREATE DATABASE 권한이 있다.
        run: |
          uv run coverage run -m pytest app -m "not db"
          uv run coverage run --append -m pytest app -m db
          uv run coverage run --append -m pytest tests
          uv run coverage report -m

      # 🔴 커버리지를 **게이트**로 쓴다 — 총량 임계치가 아니라 baseline(뒷걸음만 차단).
      #   총량 임계치는 넘기면 아무도 안 보고, 못 넘기면 사람이 끈다. MyPy 가 이미
      #   baseline 으로 성공한 방식을 그대로 이식했다(scripts/mypy_gate.py).
      #   ⚠️ 이 게이트는 «실행됐나» 만 본다. «틀리면 빨개지나» 는 보지 않는다 —
      #   쓸모는 품질 측정이 아니라 **V-H(도달 불가 분기) 탐지**다. 한계 선언 = 게이트 docstring.
      - name: Coverage Baseline Gate
        if: steps.check_tests.outputs.has_tests == 'true'
        env:
          PYTHONPATH: "."
        run: |
          uv run coverage json -o coverage.json
          uv run python -m scripts.gates.code.check_coverage_baseline
