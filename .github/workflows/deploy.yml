name: CD (deploy)

# ── CD 파이프라인 (로드맵 4) ─────────────────────────────────────────
# 흐름: ① test -> ② ghcr 이미지 빌드/push(:latest+:sha)
#       -> ③ WIF(keyless)+IAP SSH 로 VM 에서 compose pull+up
#       -> ④ health-check (실패 시 :sha 태그로 롤백)
# 원칙: 빌드는 GHA(4vCPU), VM 은 pull 만 (e2-micro 빌드부담·다운타임 제거).
on:
  # main 에 push 되면 자동 배포. 수동 재배포/롤백용으로 dispatch 도 유지.
  push:
    branches:
      - main
    # 경로 필터(F1): FE·docs 만 바뀐 커밋은 BE 재배포를 트리거하지 않는다.
    # deny-list(paths-ignore) 채택 — 목록에 없는 새 경로는 기본 배포(안전 방향).
    # allow-list 였다면 새 BE 파일 누락 시 조용히 under-deploy(prod 드리프트 위험).
    # 혼합 커밋(BE+docs)은 정상 배포. FE 공개는 CF Pages(production 브랜치)가 담당.
    # 아래 경로만 바뀐 커밋은 BE 재배포를 트리거하지 않는다. 판정 기준 =
    # "이 경로가 BE 런타임 이미지의 내용이나 동작을 바꿀 수 있는가?"
    # (.dockerignore 가 .github/·envs/·docs/ 를 이미 제외하므로 이미지 자체가 동일하다)
    paths-ignore:
      - 'medication-frontend/**' # 공개 FE 는 Cloudflare Pages(production 브랜치) 담당
      - 'docs/**' # .dockerignore 제외 대상
      - '**/*.md'
      - '.github/**' # .dockerignore 제외 대상. 워크플로 변경은 다음 실행부터 적용됨
      - 'envs/**' # .dockerignore 제외 대상. prod env 는 VM 자체 .env 가 공급
      - '.env.example' # 템플릿일 뿐 앱은 .env 를 읽는다(런타임 무영향)
  workflow_dispatch:

# 동일 ref 배포 직렬화 (동시 배포로 인한 경쟁 방지)
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kimyeongbin-dev/doseph-fastapi

jobs:
  # ── ① 테스트 게이트 (배포 전 안전망) ────────────────────────────────
  # 흐름: Postgres15 서비스 -> uv sync(app) -> pytest. 실패 시 후속 잡 미실행.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pw1234
          POSTGRES_DB: doseph_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --group app --frozen

      - name: Run tests
        env:
          PYTHONPATH: "."
          # ENV 는 필수값(기본값 없음 — fail-closed). CI 에는 .env 가 없으므로 명시 주입.
          ENV: local
          DB_USER: postgres
          DB_PASSWORD: pw1234
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: doseph_db
        run: uv run pytest app

  # ── ② 이미지 빌드 & ghcr push ──────────────────────────────────────
  # 흐름: buildx -> app/Dockerfile.prod 빌드 -> ghcr push(:latest + :sha)
  #       캐시 type=gha 로 빌드 가속. VM 은 이 이미지를 pull 만 함.
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (fastapi/migrate 공용 이미지)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: app/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── ③ VM 배포 (WIF keyless + IAP SSH) ──────────────────────────────
  # 흐름: GitHub OIDC -> GCP WIF(장기키 없음) -> IAP 터널 SSH
  #       -> VM: git pull + compose pull + up -d --no-build (migrate->fastapi)
  # VM 은 빌드 안 함(--no-build). 이미지는 ②에서 pull.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/673825765466/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@doseph-507923.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy over IAP SSH
        run: |
          gcloud compute ssh doseph-api \
            --zone=us-west1-b \
            --tunnel-through-iap \
            --quiet \
            --command="sudo bash -c 'cd /opt/Doseph && git pull --ff-only && DOSEPH_IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.gcp-login.yml pull fastapi migrate && DOSEPH_IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.gcp-login.yml up -d --no-build'"

  # ── ④ 헬스체크 (공개 엔드포인트, 재시도) ──────────────────────────
  # 흐름: api.doseph.com/api/v1/health 를 최대 5회(15s 간격) 폴링.
  #       재빌드 없이 pull+up 이라 부팅 짧으나 재기동 순간 502 가능 → 재시도로 흡수.
  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Poll public health endpoint
        run: |
          for i in $(seq 1 5); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://api.doseph.com/api/v1/health || echo "000")
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "health OK"
              exit 0
            fi
            sleep 15
          done
          echo "health check failed (마지막 코드=$code)"
          exit 1
