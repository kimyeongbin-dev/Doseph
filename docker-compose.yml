# 로컬 개발용 Docker Compose.
# 보안: 로컬에선 postgres/redis 포트를 호스트에 노출해 DBeaver / redis-cli 로 접근 가능.
# 프로드는 docker-compose.prod.yml 에서 내부 전용으로 격리.

services:
  # PostgreSQL + pgvector — RAG 벡터 저장소
  # 공식 pgvector image. ankane/pgvector 는 archived 라 마이그레이션함.
  #
  # ⚠️ 태그를 **PG 메이저와 pgvector 버전까지 완전 고정**한다(`pg17` 같은 floating 태그 금지).
  #    기준은 "최신"이 아니라 **prod(Neon)와 같게** 다 — 2026-09-15 실측으로 prod 는
  #    PostgreSQL 17.11 · pgvector 0.8.0 이었고, 그때까지 로컬/CI 는 PG15 라 **메이저가
  #    2단계 어긋나 있었다**. 로컬이 prod 보다 새 pgvector 를 쓰면 0.8.1+ 기능이
  #    로컬에서만 통과하고 prod 에서 깨진다(패리티는 방향이 있다).
  #    이 값은 `app/tests/db/test_db_version_pin.py` 가 단언하므로, 태그만 바꾸면 빨개진다.
  #    CI(.github/workflows/checks.yml)도 **같은 태그**를 써야 한다.
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER:-doseph_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-doseph_admin}
      POSTGRES_DB: ${DB_NAME:-doseph_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-doseph_admin} -d ${DB_NAME:-doseph_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # Redis — RQ 큐 + PendingTurn + 캐시
  redis:
    image: redis:alpine
    container_name: redis
    # 60 초마다 서버측 TCP keepalive PING — Docker bridge / WSL2 NAT 의 idle TCP
    # 세션 강제 종료(Idle Connection Drop) 1차 예방. 클라이언트(redis-py) 의
    # ``socket_keepalive`` + ``health_check_interval`` 와 양방향 보호.
    command: ["redis-server", "--tcp-keepalive", "60"]
    networks:
      - backend
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # FastAPI API 서버 — ML 추론은 ai-worker 에 위임, bind mount 로 hot-reload
  fastapi:
    container_name: fastapi
    # 로컬 전용: Windows 바인드마운트(./logs → /app/logs 가 root:root)에 파일로깅 +
    # uvicorn --reload 워처가 쓰기/탐색 가능하도록 root 실행. prod 는 Dockerfile.prod 의 appuser 유지.
    user: "root"
    build:
      context: .
      dockerfile: app/Dockerfile
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}
    env_file:
      - .env
    command: >
      sh -c "uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./app:/app/app
      - ./ai_worker:/app/ai_worker
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      # pyproject 마운트: ruff/pytest 설정 변경이 즉시 반영되도록(의존성 변경만 재빌드).
      # 미마운트 시 이미지 내장 stale 설정으로 로컬 ruff 가 거짓 양성을 냄.
      - ./pyproject.toml:/app/pyproject.toml:ro
      # 🔴 uv.lock 도 같이 마운트한다 (2026-09-23, L-12).
      # 위 주석의 논리가 **두 파일 중 하나에만** 적용돼 있었다 — pyproject 는 신선한데
      # uv.lock 은 이미지 내장(실측: 컨테이너 2026-05-03 vs 호스트 2026-09-21, 4.5개월 차)이라
      # `uv sync` 가 낡은 잠금으로 «이미 맞다» 고 답했다. 그동안 테스트가 돈 이유는
      # **컨테이너 쓰기 레이어에 남아 있던 수동 설치** 뿐이고, `--force-recreate` 한 번에 사라졌다
      # (freezegun·respx 미설치 → 수집 에러 3건). 🔑 이미지가 아니라 **그 컨테이너**가 정답을 들고 있었다.
      - ./uv.lock:/app/uv.lock:ro
      - ./logs/fastapi:/app/logs
      - static_volume:/app/templates
    environment:
      # 🔴 호스트가 컴파일한 .pyc 를 컨테이너가 읽지 못하게 한다 (L-8).
      # app/·ai_worker/·scripts/ 는 **바인드 마운트**라 호스트의 __pycache__ 가 그대로 보인다.
      # 실측 2026-09-23: 호스트(3.13.12)와 컨테이너(3.13.14)의 **매직이 같아**(f30d0d0a)
      # 컨테이너가 그 .pyc 를 그대로 적재한다 — co_filename 이 호스트 절대경로인 채 커버리지에
      # 박혀 `coverage json` 이 *No source for code* 로 죽는다(2026-09-21 실발생 · 당시 3건).
      # 🔑 테스트는 그대로 초록이라 **틀렸다는 신호가 측정 단계에서만** 나온다.
      # PYTHONPYCACHEPREFIX 는 캐시를 마운트 **밖**으로 옮겨 읽기·쓰기를 동시에 끊는다.
      # ⚠️ 호스트에 .pyc 를 안 만들게 하는 길(PYTHONDONTWRITEBYTECODE)은 **호스트 설정**이라
      #    그 자체가 git 밖 잔재가 된다 — 그래서 안 쓴다(L 원장을 늘리는 해법은 해법이 아니다).
      PYTHONPYCACHEPREFIX: /tmp/pycache
      LOG_DIR: /app/logs
      # 로컬 전용 상향 — E2E 스위트는 단일 IP 에서 짧은 시간에 수백 건을 보낸다.
      # 운영 기본값(GET 200/분)이면 스위트 중반부터 429 가 나고, FE 는 그 실패를
      # 빈 목록으로 렌더해 "데이터가 없다"로 오인된다. 코드는 동일, 값만 환경별.
      RATE_LIMIT_GET_MAX_REQUESTS: ${RATE_LIMIT_GET_MAX_REQUESTS:-2000}
      RATE_LIMIT_MUTATION_MAX_REQUESTS: ${RATE_LIMIT_MUTATION_MAX_REQUESTS:-300}
      RATE_LIMIT_AUTH_MAX_REQUESTS: ${RATE_LIMIT_AUTH_MAX_REQUESTS:-200}
    ports:
      - "8000:8000"
    networks:
      - frontend  # 외부 OAuth 아웃바운드 (로컬 독립 API — nginx 제거됨)
      - backend   # DB / Redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # AI Worker — ko-sroberta + OpenAI + OCR
  # app/ 바인드: ai_worker.utils.rag → app.dtos.rag 의존
  ai-worker:
    container_name: ai-worker
    # 로컬 전용: 로그 바인드마운트 쓰기 권한(위 fastapi 주석 참조). prod 는 appuser.
    user: "root"
    build:
      context: .
      dockerfile: ai_worker/Dockerfile
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:ai-${AI_WORKER_VERSION}
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./ai_worker:/app/ai_worker
      - ./scripts:/app/scripts
      # pyproject 마운트: 로컬 설정 stale 방지(fastapi 서비스와 동일 이유).
      - ./pyproject.toml:/app/pyproject.toml:ro
      # 🔴 uv.lock 도 같이 마운트한다 (2026-09-23, L-12).
      # 위 주석의 논리가 **두 파일 중 하나에만** 적용돼 있었다 — pyproject 는 신선한데
      # uv.lock 은 이미지 내장(실측: 컨테이너 2026-05-03 vs 호스트 2026-09-21, 4.5개월 차)이라
      # `uv sync` 가 낡은 잠금으로 «이미 맞다» 고 답했다. 그동안 테스트가 돈 이유는
      # **컨테이너 쓰기 레이어에 남아 있던 수동 설치** 뿐이고, `--force-recreate` 한 번에 사라졌다
      # (freezegun·respx 미설치 → 수집 에러 3건). 🔑 이미지가 아니라 **그 컨테이너**가 정답을 들고 있었다.
      - ./uv.lock:/app/uv.lock:ro
      - ./logs/ai-worker:/app/logs
    environment:
      # 🔴 호스트가 컴파일한 .pyc 를 컨테이너가 읽지 못하게 한다 (L-8).
      # app/·ai_worker/·scripts/ 는 **바인드 마운트**라 호스트의 __pycache__ 가 그대로 보인다.
      # 실측 2026-09-23: 호스트(3.13.12)와 컨테이너(3.13.14)의 **매직이 같아**(f30d0d0a)
      # 컨테이너가 그 .pyc 를 그대로 적재한다 — co_filename 이 호스트 절대경로인 채 커버리지에
      # 박혀 `coverage json` 이 *No source for code* 로 죽는다(2026-09-21 실발생 · 당시 3건).
      # 🔑 테스트는 그대로 초록이라 **틀렸다는 신호가 측정 단계에서만** 나온다.
      # PYTHONPYCACHEPREFIX 는 캐시를 마운트 **밖**으로 옮겨 읽기·쓰기를 동시에 끊는다.
      # ⚠️ 호스트에 .pyc 를 안 만들게 하는 길(PYTHONDONTWRITEBYTECODE)은 **호스트 설정**이라
      #    그 자체가 git 밖 잔재가 된다 — 그래서 안 쓴다(L 원장을 늘리는 해법은 해법이 아니다).
      PYTHONPYCACHEPREFIX: /tmp/pycache
      LOG_DIR: /app/logs
    networks:
      - frontend  # OpenAI / Kakao Local / CLOVA OCR 외부 호출
      - backend   # Redis
    healthcheck:
      test: ["CMD", "pgrep", "-f", "python"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_data:
  static_volume:

networks:
  # 외부 API 아웃바운드(fastapi/ai-worker OAuth/OpenAI 등). nginx 제거됨(로컬 독립 API 전환).
  frontend:
    driver: bridge
  # 컨테이너 간 통신 전용. 로컬에선 postgres/redis 디버깅 편의상 internal=false.
  # 프로드는 internal: true 로 인터넷 차단.
  backend:
    driver: bridge
