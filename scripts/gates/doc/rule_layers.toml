# 규칙 ↔ 발동 층 연결 검사의 **면제 목록**.
#
# 🔴 사유 없는 면제는 없다. 사유를 못 쓰겠으면 그건 진짜 구멍이다
#    (`comment_vocabulary.toml` 의 reason 강제와 같은 결).
#
# 면제한다 = *"이 절은 층②·③ 포인터가 없어도 된다"* 는 **판단을 내렸다**는 뜻이다.
# 새 절이 생기면 자동으로 여기 없으므로 **반드시 한 번은 판단을 거친다** — 그게 이 파일의 목적이다.

[[exempt]]
section = "0"
reason = "한 줄 원칙. §1 이하 전체의 머리말이라 별도 포인터가 의미 없다."

[[exempt]]
section = "3-1"
reason = "파일명으로 종류를 판정하지 않는다 — 분류 작업 중에만 쓰는 상세. 층② 는 §1.3 에서 FILING 전체를 이미 가리킨다."

[[exempt]]
section = "3-2"
reason = "문서 작성 규칙(어순). §3 파일명 규칙의 하위 상세."

[[exempt]]
section = "7-1"
reason = "판 교체형 목록. §7 회전이 층②·③ 에서 불리고 이건 그 안의 표다."

[[exempt]]
section = "8-1"
reason = "status 어휘표. 개별 어휘(§8-4·8-5·8-6)가 각각 층② 에서 불린다."

[[exempt]]
section = "8-2"
reason = "3중 교차검증. 층②·③ 이 '`status: in-progress`/`current` ⟺ 날짜 없음 ⟺ 직하' 를 **문장으로** 이미 담고 있다(절 번호로 부르지 않을 뿐)."

[[exempt]]
section = "8-3"
reason = "항목 배출형의 두 층 상태. §7-2 가 층② 에서 불리고 이건 그 상세."

[[exempt]]
section = "8-7"
reason = "sync 필드는 portfolio 전용이고 게이트(`portfolio-sync`)가 강제한다. 매 턴 행동 규칙이 아니다."

[[exempt]]
section = "9-1"
reason = "절 단위 신선도 검증 원리. 게이트(`doc-meta`)가 대신 하므로 사람이 매 턴 알 필요가 없다."

[[exempt]]
section = "11"
reason = "_unfiled/·_legacy/ 설명. 층② 가 폴더 지도에서 이미 두 폴더를 보여준다."

[[exempt]]
section = "11-1"
reason = "건별 판단은 기준이 아니다 — **트랙 B-9 한시 규칙**. 분류가 끝나면 상황 자체가 사라지므로 층② 에 올리면 끝난 뒤에도 남아 판단을 요구한다(그 절 본문이 그렇게 적고 있다)."

[[exempt]]
section = "13"
reason = "아직 옮기지 않은 것 — 상태 목록이지 규칙이 아니다. B-9 가 끝나면 사라진다."

[[exempt]]
section = "14"
reason = "이 규약이 지키려는 실패(근거표). 규칙이 아니라 왜의 기록."
