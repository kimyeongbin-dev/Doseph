# 폐기된 개념의 어휘 사전 — `scripts/check_comment_staleness.py` 가 읽는다.
#
# 왜 이 파일이 있나
# -----------------
# 개념을 폐기하면 코드는 바뀌는데 **그 개념을 말하는 문장은 저장소 곳곳에 남는다.**
# QA-01 이 soft delete 를 폐지한 뒤 거짓 문장 57줄이 남았고, 실측 결과 그중
# **47줄(82%)** 이 폐기된 *어휘*만으로 검출됐다. 가장 싸고 가장 잘 잡는 수단이다.
#
# 쓰는 법
# -------
# 개념을 폐기할 때 [[banned]] 에 그 어휘를 등록한다. 그 순간부터 저장소 어디서든
# 그 단어가 나오면 push 가 막힌다. 정당한 사용은 [[allow]] 에 **사유와 함께** 넣는다.
# 사유가 없으면 로드 자체가 실패한다 — 사유 없는 허용목록은 곧 통과 기계가 된다.
#
# ⚠️ 한계: 이 사전은 **폐기된 어휘**만 잡는다. "유예 7일" 이 14일로 바뀌었는데 주석은
# 7일인 경우처럼 **값이 어긋난 것은 못 잡는다** — 그건 상수와 테스트가 잠근다
# (예: `test_default_grace_period_is_seven_days`).

