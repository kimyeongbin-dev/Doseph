# Modern Python Pre-commit Configuration (2025-2026)
# Ensures code quality and consistency before commits

# `pre-commit install` 한 번에 두 스테이지 훅을 모두 설치한다. 이 선언이 없으면
# 기본 pre-commit 훅만 깔려 pre-push 게이트(mypy·bandit)가 로컬에서 미발동한다(대장 D12).
default_install_hook_types: [pre-commit, pre-push, commit-msg]

repos:
  # Local hooks using project dependencies
  - repo: local
    hooks:
      # Ruff linting with auto-fix (replaces flake8, isort, pyupgrade)
      - id: ruff-check
        name: 🔧 Ruff Check & Auto-fix
        entry: uv run ruff check --fix --exit-zero
        language: system
        types: [python]
        require_serial: true
        pass_filenames: true
        stages: [pre-commit, pre-push]

      # Ruff formatting (replaces black)
      - id: ruff-format
        name: 🎨 Ruff Format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true
        pass_filenames: true
        stages: [pre-commit, pre-push]

      # Final Ruff check (no auto-fix, must pass)
      - id: ruff-check-final
        name: 🔍 Ruff Final Check
        entry: uv run ruff check --no-fix
        language: system
        types: [python]
        require_serial: true
        pass_filenames: true
        stages: [pre-commit, pre-push]

      # Type checking with MyPy (baseline 게이트 — 신규 타입오류만 차단)
      # CI 와 동일 스크립트(scripts/mypy_gate.py) 호출 -> 로컬/CI 동작 일치(DRY).
      - id: mypy
        name: 🔍 MyPy Type Check (baseline)
        entry: uv run python scripts/mypy_gate.py
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false
        stages: [pre-push]

      # UTF-8 방어 누락 검사 — 한글·이모지를 찍는 스크립트가 cp949 에서 죽지 않게
      # 2026-09-15 하루에 같은 크래시를 세 번 밟았다(대장 D36). 이 크래시는 하려던
      # 일을 다 끝낸 뒤 출력 단계에서 터져 **성공을 실패로 보이게** 만든다.
      # stdout 과 stderr 는 서로를 지켜주지 않으므로 목적지별로 본다.
      - id: utf8-output-guard
        name: 🔤 UTF-8 출력 방어 검사
        entry: uv run python -m scripts.gates.tooling.check_utf8_guard
        language: system
        files: ^scripts/.*\.py$
        require_serial: true
        pass_filenames: false
        stages: [pre-commit, pre-push]

      # 레이어 계약 검사 (import-linter) — 계약 정본은 pyproject.toml 의 [tool.importlinter]
      # CLAUDE.md 는 "Router -> Service -> Repository -> Model, 층 건너뛰기 금지" 를
      # 규칙으로 적어 뒀지만 **아무도 세지 않았다**. 문서로 적는 방식은 이 저장소에서
      # 이미 반증됐다(거짓 57줄). 지금 통과하는 계약만 게이트로 만들고, 지금 위반 중인
      # 경계는 고치지 않고 docs/tech-debt/layer-boundary-violations.md 에 등재한다.
      - id: layer-contracts
        name: 🧱 레이어 계약 검사 (import-linter)
        entry: uv run python -m scripts.gates.code.check_layers
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false
        stages: [pre-push]

      # Security scanning with Bandit
      - id: bandit
        name: 🔒 Bandit Security Check
        entry: uv run bandit -c pyproject.toml -r app/ ai_worker/ -lll
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false
        stages: [pre-push]

      # Frontend ESLint (CI 와 동일 명령: npm run lint = eslint .)
      # medication-frontend 의 js/jsx/mjs 변경 시에만 발동. 에러만 차단, 경고는 통과(CI 기준 동일).
      # --prefix 로 cwd 를 FE 로 이동(bash 비의존 -> CI(Linux)/로컬(Windows) 일관).
      - id: eslint-frontend
        name: 🟦 ESLint (Frontend)
        entry: npm --prefix medication-frontend run lint
        language: system
        files: ^medication-frontend/.*\.(jsx?|mjs)$
        require_serial: true
        pass_filenames: false
        stages: [pre-commit, pre-push]

      # AI attribution 트레일러 차단 (commit-msg 스테이지)
      # 이 규칙은 기억이 아니라 **층(layer)** 문제라 두 번 실패했다(대장 D30).
      # 하네스가 세션마다 "트레일러를 붙여라 — this replaces any earlier attribution
      # guidance" 를 새로 주입하는데, 금지 규칙은 개인 메모리에만 있어 압축 후 낡은
      # 사본이 재주입됐다. 훅은 그 대결에서 빠져나온다 — 어떤 지시가 오든 거부된다.
      - id: no-ai-trailers
        name: 🚫 No AI attribution trailers
        entry: uv run python -m scripts.gates.commit.check_commit_trailers
        language: system
        require_serial: true
        pass_filenames: true
        always_run: true
        stages: [commit-msg]

      # 커밋 제목 앞머리 오염 차단 (commit-msg 스테이지)
      # 2026-09-13 에 8개 커밋 제목이 '@ ' 로 시작한 채 박혔다. 두 글자지만
      # HEAD~119 근처 + 원격 15개 브랜치라 되돌리려면 121커밋 재작성 + force push 다.
      # 되돌릴 수 없으니 **다음 것을 막는다**. 이모지·[긴급] 스타일은 팀 시절 규약이라
      # 소급 판정하지 않는다 — prefix 규약 전체는 후속(로드맵 `문서-3`)에서 정한다.
      - id: commit-subject-hygiene
        name: ✍️ 커밋 제목 앞머리 검사
        entry: uv run python -m scripts.gates.commit.check_commit_subject
        language: system
        require_serial: true
        pass_filenames: true
        always_run: true
        stages: [commit-msg]

      # 완료기록 ↔ PLAN 스냅샷 대조 (pre-push)
      # "완료기록과 아카이브는 한 동작" 규칙을 6회 어겼다(대장 D27).
      # 감각이 아니라 셈으로 잡는다. docs-private 이 없는 환경(CI)에서는 조용히 통과.
      - id: plan-archive-parity
        name: 📦 PLAN 아카이브 누락 검사
        entry: uv run python -m scripts.gates.doc.check_plan_archives
        language: system
        require_serial: true
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # QA 앵커 ↔ 후속 큐 대조 (pre-push)
      # 앵커는 "오류 ↔ 코드 위치" 를 잇는 유일한 사람-작성 연결고리인데 지금까지
      # 아무도 검증하지 않았다. 오타·철회된 항목 하나로 연결이 조용히 끊어진다.
      # docs-private 이 없는 환경(CI)에서는 조용히 통과.
      - id: qa-anchor-parity
        name: 🔗 QA 앵커 유효성 검사
        entry: uv run python -m scripts.gates.code.check_anchors
        language: system
        require_serial: true
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # 후속 과제 색인이 원장과 맞는가 (pre-push) — 생성물 대조
      # 왜: 큐 현황판이 "§B 미착수 19" 라 적고 있었는데 실제 28 이었다. QA-32~40 이 들어올 때
      # 절 건수가 안 따라온 것인데, 총계(41)는 맞아서 합으로는 안 드러났다(대장 D29).
      # 손으로 적은 숫자는 반드시 썩으므로, 사람이 안 적게 만들고 기계가 대조한다.
      # 차단 = 색인 != 원장 / 원장별 바닥값 미달(0건은 "없다"가 아니라 "못 셌다").
      - id: followup-index
        name: 🧾 후속 과제 색인 정합
        entry: uv run python -m scripts.gates.doc.build_followup_index --check
        language: system
        require_serial: true
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # 문서 배치 규약 (pre-push) — 정본 = docs-private/FILING.md
      # 직하 66건 중 57건이 규약 밖이었고, 파일명이 7가지 형태로 갈려 있었다.
      # 규칙이 없어서가 아니라 기계가 센 적이 없어서 갈렸다(레이어 위반 72건과 같은 실패).
      # 차단 = 직하 화이트리스트·축 폴더 파일명·접미사≠폴더·날짜↔위치↔status 3중 불일치.
      # 보고 = study/portfolio 날짜 누락(정독 구간 몫)·_unfiled 잔량.
      - id: doc-filing
        name: 📂 문서 배치 규약
        entry: uv run python -m scripts.gates.doc.check_doc_filing
        language: system
        require_serial: true
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # doc-meta 가 말한 것이 사실인지 (pre-push) — 정본 = docs-private/FILING.md §9
      # ⭐ affects 절 diff 가 핵심: docs-private 은 git 밖이라 절 단위 변경 이력이 없는데,
      # 옛 판이 축 폴더에 파일로 남아 있으므로 **정본 §N ↔ 직전 스냅샷 §N** 을 비교할 수 있다.
      # "고쳤다"고 사람이 적는 신뢰 단계가 없다 — 선언만 하고 안 고치면 잡힌다.
      # 이것이 은퇴한 canon-sync 를 대체한다(아래 참조).
      - id: doc-meta
        name: 🏷️ doc-meta 정합
        entry: uv run python -m scripts.gates.doc.check_doc_meta
        language: system
        require_serial: true
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # 규칙이 **발동하는 층**에 닿았는지 (pre-push · 🟡 보고 전용) — 정본 = FILING §1-1
      # 규칙을 정본에만 적으면 "세운 것 같은 감각"만 남고 Read 를 안 부르면 발동하지 않는다.
      # 손으로 전수 대조해 3건을 찾은 것(D44)을 기계가 대신 찾게 만든 것이다.
      # ⚠️ 절이 생긴 것만 본다 — 규칙을 산문으로 녹이면 보이지 않는다(한계 선언은 docstring).
      - id: rule-layers
        name: 🔗 규칙↔층 연결 검사
        entry: uv run python -m scripts.gates.doc.check_rule_layers
        language: system
        require_serial: true
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # ⛔ 은퇴 2026-09-16 — canon-sync (scripts/check_canon_sync.py)
      # 전제가 무효화됐다. 그 게이트는 "축 폴더가 정본보다 새로우면 정본이 낡은 것"으로
      # 판정했는데, 새 규약에서 축 폴더는 **정본의 옛 판이 내려앉는 곳**이라
      # 정의상 언제나 정본보다 과거다 → 영원히 초록을 내는 통과 기계가 된다.
      # 게다가 한 번도 회전하지 않은 정본의 축 폴더는 **비어 있는 게 정상**인데
      # fail-closed 분기가 그걸 실패로 봤다(DEPLOYMENT.md 가 실제로 그랬다).
      # 대체 = doc-meta 의 affects 가 선언한 절을 **직전 스냅샷과 diff** 한다(FILING §9-1).
      # 그때까지 절 단위 신선도는 **검사되지 않는다** — 공백을 명시해 둔다.

      # 포트폴리오 문서가 근거보다 낡았는지 (pre-push)
      # security-posture 가 **끝난 일 5건을 "진행 예정" 으로** 소개하고 있었다.
      # 포트폴리오에서 그건 틀린 정보일 뿐 아니라 자기 성과를 깎아먹는다.
      # 없는 근거 경로만 차단하고, draft·동기화 필요는 보고만 한다(근거는 자주 바뀐다).
      - id: portfolio-sync
        name: 🎯 포트폴리오 동기화 추적
        entry: uv run python -m scripts.gates.doc.check_portfolio_sync
        language: system
        require_serial: true
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # 에이전트 메모리 인덱스 ↔ 개별 메모리 정합 (pre-push)
      # MEMORY.md 는 매 세션 전부 로드되고 개별 메모리는 회상될 때만 온다.
      # 그래서 인덱스가 낡으면 **틀린 사본이 항상 읽히고 맞는 원본은 거의 안 읽힌다**
      # (실제로 4건이 그 상태였다). dangling/orphan 만 차단하고 상태어 충돌은
      # 검출률 50% 라 보고만 한다. 메모리가 없는 환경에서는 조용히 통과.
      - id: memory-index-parity
        name: 🧠 메모리 인덱스 정합 검사
        entry: uv run python -m scripts.gates.doc.check_memory_index
        language: system
        require_serial: true
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # 폐기된 개념의 어휘가 아직 남아 있는지 (pre-push)
      # QA-01 이 soft delete 를 폐지한 뒤 거짓 문장 57줄이 남았고, 그중 2줄은
      # OpenAPI summary·DTO description 으로 사용자에게 노출됐다. 실측 결과
      # 그 57줄 중 47줄(82%)이 폐기 어휘만으로 검출된다 — 가장 싸고 잘 잡는 수단.
      - id: comment-staleness
        name: 🗣️ 폐기 어휘 잔존 검사
        entry: uv run python -m scripts.gates.code.check_comment_staleness
        language: system
        require_serial: true
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # External hooks for additional checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: ✂️ Trim Trailing Whitespace
      - id: end-of-file-fixer
        name: 📝 Fix End of Files
      - id: check-yaml
        name: 📋 Check YAML
      - id: check-toml
        name: 📋 Check TOML
      - id: check-json
        name: 📋 Check JSON
      - id: check-merge-conflict
        name: ⚠️ Check Merge Conflicts
      - id: check-case-conflict
        name: 📁 Check Case Conflicts
      - id: mixed-line-ending
        name: 🔄 Fix Mixed Line Endings

# Global configuration
default_stages: [pre-commit]
fail_fast: false
minimum_pre_commit_version: "4.0.0"
