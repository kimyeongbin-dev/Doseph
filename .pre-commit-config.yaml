# Modern Python Pre-commit Configuration (2025-2026)
# Ensures code quality and consistency before commits

# `pre-commit install` 한 번에 두 스테이지 훅을 모두 설치한다. 이 선언이 없으면
# 기본 pre-commit 훅만 깔려 pre-push 게이트(mypy·bandit)가 로컬에서 미발동한다(대장 D12).
default_install_hook_types: [pre-commit, pre-push, commit-msg]

repos:
  # Local hooks using project dependencies
  - repo: local
    hooks:
      # Ruff linting with auto-fix (replaces flake8, isort, pyupgrade)
      - id: ruff-check
        name: 🔧 Ruff Check & Auto-fix
        entry: uv run ruff check --fix --exit-zero
        language: system
        types: [python]
        require_serial: true
        pass_filenames: true
        stages: [pre-commit, pre-push]

      # Ruff formatting (replaces black)
      - id: ruff-format
        name: 🎨 Ruff Format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true
        pass_filenames: true
        stages: [pre-commit, pre-push]

      # Final Ruff check (no auto-fix, must pass)
      - id: ruff-check-final
        name: 🔍 Ruff Final Check
        entry: uv run ruff check --no-fix
        language: system
        types: [python]
        require_serial: true
        pass_filenames: true
        stages: [pre-commit, pre-push]

      # Type checking with MyPy (baseline 게이트 — 신규 타입오류만 차단)
      # CI 와 동일 스크립트(scripts/mypy_gate.py) 호출 -> 로컬/CI 동작 일치(DRY).
      - id: mypy
        name: 🔍 MyPy Type Check (baseline)
        entry: uv run python scripts/mypy_gate.py
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false
        stages: [pre-push]

      # UTF-8 방어 누락 검사 — 한글·이모지를 찍는 스크립트가 cp949 에서 죽지 않게
      # 2026-09-15 하루에 같은 크래시를 세 번 밟았다(대장 D36). 이 크래시는 하려던
      # 일을 다 끝낸 뒤 출력 단계에서 터져 **성공을 실패로 보이게** 만든다.
      # stdout 과 stderr 는 서로를 지켜주지 않으므로 목적지별로 본다.
      - id: utf8-output-guard
        name: 🔤 UTF-8 출력 방어 검사
        entry: uv run python scripts/check_utf8_guard.py
        language: system
        files: ^scripts/.*\.py$
        require_serial: true
        pass_filenames: false
        stages: [pre-commit, pre-push]

      # 레이어 계약 검사 (import-linter) — 계약 정본은 pyproject.toml 의 [tool.importlinter]
      # CLAUDE.md 는 "Router -> Service -> Repository -> Model, 층 건너뛰기 금지" 를
      # 규칙으로 적어 뒀지만 **아무도 세지 않았다**. 문서로 적는 방식은 이 저장소에서
      # 이미 반증됐다(거짓 57줄). 지금 통과하는 계약만 게이트로 만들고, 지금 위반 중인
      # 경계는 고치지 않고 docs/tech-debt/layer-boundary-violations.md 에 등재한다.
      - id: layer-contracts
        name: 🧱 레이어 계약 검사 (import-linter)
        entry: uv run python scripts/check_layers.py
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false
        stages: [pre-push]

      # Security scanning with Bandit
      - id: bandit
        name: 🔒 Bandit Security Check
        entry: uv run bandit -c pyproject.toml -r app/ ai_worker/ -lll
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false
        stages: [pre-push]

      # Frontend ESLint (CI 와 동일 명령: npm run lint = eslint .)
      # medication-frontend 의 js/jsx/mjs 변경 시에만 발동. 에러만 차단, 경고는 통과(CI 기준 동일).
      # --prefix 로 cwd 를 FE 로 이동(bash 비의존 -> CI(Linux)/로컬(Windows) 일관).
      - id: eslint-frontend
        name: 🟦 ESLint (Frontend)
        entry: npm --prefix medication-frontend run lint
        language: system
        files: ^medication-frontend/.*\.(jsx?|mjs)$
        require_serial: true
        pass_filenames: false
        stages: [pre-commit, pre-push]

      # AI attribution 트레일러 차단 (commit-msg 스테이지)
      # 이 규칙은 기억이 아니라 **층(layer)** 문제라 두 번 실패했다(대장 D30).
      # 하네스가 세션마다 "트레일러를 붙여라 — this replaces any earlier attribution
      # guidance" 를 새로 주입하는데, 금지 규칙은 개인 메모리에만 있어 압축 후 낡은
      # 사본이 재주입됐다. 훅은 그 대결에서 빠져나온다 — 어떤 지시가 오든 거부된다.
      - id: no-ai-trailers
        name: 🚫 No AI attribution trailers
        entry: uv run python scripts/check_commit_trailers.py
        language: system
        require_serial: true
        pass_filenames: true
        always_run: true
        stages: [commit-msg]

      # 커밋 제목 앞머리 오염 차단 (commit-msg 스테이지)
      # 2026-09-13 에 8개 커밋 제목이 '@ ' 로 시작한 채 박혔다. 두 글자지만
      # HEAD~119 근처 + 원격 15개 브랜치라 되돌리려면 121커밋 재작성 + force push 다.
      # 되돌릴 수 없으니 **다음 것을 막는다**. 이모지·[긴급] 스타일은 팀 시절 규약이라
      # 소급 판정하지 않는다 — prefix 규약 전체는 후속(로드맵 `문서-3`)에서 정한다.
      - id: commit-subject-hygiene
        name: ✍️ 커밋 제목 앞머리 검사
        entry: uv run python scripts/check_commit_subject.py
        language: system
        require_serial: true
        pass_filenames: true
        always_run: true
        stages: [commit-msg]

      # 완료기록 ↔ PLAN 스냅샷 대조 (pre-push)
      # "완료기록과 아카이브는 한 동작" 규칙을 6회 어겼다(대장 D27).
      # 감각이 아니라 셈으로 잡는다. docs-private 이 없는 환경(CI)에서는 조용히 통과.
      - id: plan-archive-parity
        name: 📦 PLAN 아카이브 누락 검사
        entry: uv run python scripts/check_plan_archives.py
        language: system
        require_serial: true
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # QA 앵커 ↔ 후속 큐 대조 (pre-push)
      # 앵커는 "오류 ↔ 코드 위치" 를 잇는 유일한 사람-작성 연결고리인데 지금까지
      # 아무도 검증하지 않았다. 오타·철회된 항목 하나로 연결이 조용히 끊어진다.
      # docs-private 이 없는 환경(CI)에서는 조용히 통과.
      - id: qa-anchor-parity
        name: 🔗 QA 앵커 유효성 검사
        entry: uv run python scripts/check_anchors.py
        language: system
        require_serial: true
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # 에이전트 메모리 인덱스 ↔ 개별 메모리 정합 (pre-push)
      # MEMORY.md 는 매 세션 전부 로드되고 개별 메모리는 회상될 때만 온다.
      # 그래서 인덱스가 낡으면 **틀린 사본이 항상 읽히고 맞는 원본은 거의 안 읽힌다**
      # (실제로 4건이 그 상태였다). dangling/orphan 만 차단하고 상태어 충돌은
      # 검출률 50% 라 보고만 한다. 메모리가 없는 환경에서는 조용히 통과.
      - id: memory-index-parity
        name: 🧠 메모리 인덱스 정합 검사
        entry: uv run python scripts/check_memory_index.py
        language: system
        require_serial: true
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # 폐기된 개념의 어휘가 아직 남아 있는지 (pre-push)
      # QA-01 이 soft delete 를 폐지한 뒤 거짓 문장 57줄이 남았고, 그중 2줄은
      # OpenAPI summary·DTO description 으로 사용자에게 노출됐다. 실측 결과
      # 그 57줄 중 47줄(82%)이 폐기 어휘만으로 검출된다 — 가장 싸고 잘 잡는 수단.
      - id: comment-staleness
        name: 🗣️ 폐기 어휘 잔존 검사
        entry: uv run python scripts/check_comment_staleness.py
        language: system
        require_serial: true
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # External hooks for additional checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: ✂️ Trim Trailing Whitespace
      - id: end-of-file-fixer
        name: 📝 Fix End of Files
      - id: check-yaml
        name: 📋 Check YAML
      - id: check-toml
        name: 📋 Check TOML
      - id: check-json
        name: 📋 Check JSON
      - id: check-merge-conflict
        name: ⚠️ Check Merge Conflicts
      - id: check-case-conflict
        name: 📁 Check Case Conflicts
      - id: mixed-line-ending
        name: 🔄 Fix Mixed Line Endings

# Global configuration
default_stages: [pre-commit]
fail_fast: false
minimum_pre_commit_version: "4.0.0"
